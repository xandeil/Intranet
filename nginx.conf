server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rotas do BFF (login SSO e API). Fica antes da regra de arquivos
    # estáticos para que algo como /api/arquivo.js também vá para o BFF.
    location ~ ^/(auth|api)/ {
        proxy_pass http://bff:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Respostas com dados de sessão nunca devem ir para cache
        add_header Cache-Control "no-store" always;
    }

    # Demais rotas: SPA do React
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        access_log off;
    }
}
